plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'io.github.ylw6669.chrostar'
    compileSdk 37

    defaultConfig {
        applicationId "io.github.ylw6669.chrostar"
        minSdk 33
        targetSdk 35
        versionCode 163
        versionName "2.6.7"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig true
    }
}

dependencies {
    // LSPosed API (compileOnly：运行时由 LSPosed 框架提供)
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'

    // Compose + Miuix (HyperOS 风格 UI, 0.9.4-rc01: 修复弹窗 Window 宿主缺失崩溃)
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    // material3 已移除: 全部改用 Miuix 组件
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4-rc01'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.4-rc01'
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.3'
    // navigationevent-compose: miuix 以 implementation 传递依赖(运行时已在 releaseRuntimeClasspath), 但 implementation 不暴露到 app 编译期;
    // 本 app 直接 import androidx.navigationevent.compose.* (根治 OverlayDialog 崩溃: 主动 provide 非 null owner), 故显式声明。
    // 版本 1.1.2 与 miuix 0.9.4-rc01 传递解析结果一致, 不改变运行时 classpath, 仅解锁编译期可见性。
    implementation 'androidx.navigationevent:navigationevent-compose:1.1.2'
    // v2.5.0: DexKit —— 运行时 DEX 特征查询(自动适配新版 Chrome 的混淆符号)。
    //   自带 jni 原生库(arm64 约 385KB)与 DexKitCacheBridge 缓存桥; 加载失败时由
    //   ChromeSymbols 的锚点解析与 DexNativeIdResolver 兜底, 不影响既有功能。
    implementation 'org.luckypray:dexkit:2.3.0'
}
