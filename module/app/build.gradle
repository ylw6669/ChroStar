plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.android.chrostar'
    compileSdk 37

    defaultConfig {
        applicationId "com.android.chrostar"
        minSdk 33
        targetSdk 35
        versionCode 72
        versionName "1.16.3"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig true
    }
}

dependencies {
    // LSPosed API (compileOnly：运行时由 LSPosed 框架提供)
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'

    // Compose + Miuix (HyperOS 风格 UI, 0.9.2 稳定版)
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    // material3 已移除: 全部改用 Miuix 组件
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.2'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.2'
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.3'
}
